# Use project-local folder if dataset.yaml "path" points to another machine
data:
  root_override: detection_dataset_yolo
  dataset_yaml: detection_dataset_yolo/dataset.yaml

preprocess:
  imgsz: 640
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]

augment:
  enabled: true
  random_grayscale_p: 0.1
  sanitize_min_box_side_px: 2.0
  color_jitter:
    brightness: 0.2
    contrast: 0.2
    saturation: 0.2
    hue: 0.05
  random_resized_crop:
    enabled: true
    scale_min: 0.8
    scale_max: 1.0
    ratio_min: 0.9
    ratio_max: 1.1
  cutmix:
    enabled: true
    prob: 0.5
    beta: 1.0

backbone:
  type: vit
  name: facebook/dinov2-small
  pretrained: true
  vit_patch_size: 14   # совпадает с config модели
  vit_num_prefix_tokens: 5  # 1 CLS + 4 register tokens
model:
  img_stride: 4
  heatmap_bias_init: -2.19 # взято со статьи CenterNet
  focal_alpha: 2.0
  focal_beta: 4.0
  gaussian_min_overlap: 0.7

train:
  epochs: 5
  batch_size: 16
  num_workers: 4
  lr: 0.001
  weight_decay: 0.0001
  scheduler_step_size: 5
  scheduler_gamma: 0.5
  ema_alpha: 0.97
  weight_ema_decay: 0.9999
  monitor_metric: map_50_95
  freeze_backbone_epochs: 0
  device: cuda
  seed: 42

outputs:
  project: runs
  name: exp

metrics:
  eval_conf_threshold: 0.001
  map_iou_thresholds: [0.5, 0.55, 0.6, 0.65, 0.7, 0.75, 0.8, 0.85, 0.9, 0.95]
  pr_curve_metric_iou: 0.5
  topk_inference: 100
